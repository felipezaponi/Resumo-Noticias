name: Atualizar noticias

on:
  schedule:
    # 6h, 12h e 18h no horário de Brasília (= 9h, 15h e 21h UTC)
    - cron: "0 9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python atualizar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Salvar resultado
        run: |
          git config user.name "robo-noticias"
          git config user.email "robo@users.noreply.github.com"
          git add noticias.json
          git diff --cached --quiet || (git commit -m "Atualiza noticias" && git push)
